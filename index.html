<script>
var LAW=[{"h": "فصل ۱) نقش حسابرسی", "a": [{"t": "حسابرسی چیست", "x": "حسابرسی عبارت است از بازرسی جستجوگرانه مدارک حسابداری و سایر شواهد زیربنای صورت‌های مالی. حسابرسان از راه کسب آگاهی از سیستم کنترل داخلی و بازرسی مدارک، مشاهده دارایی‌ها، پرسش از منابع داخل و خارج شرکت و اجرای سایر روش‌های رسیدگی، شواهد لازم را برای تعیین این‌که صورت‌های مالی، تصویری مطلوب و به نسبت کامل از وضعیت مالی شرکت و فعالیت‌های آن در طول دوره مورد رسیدگی ارائه می‌کند یا خیر، گردآوری می‌کنند.\n\nمعیار حسابرس = استانداردهای حسابداری. ابزار/راهنمای انجام کار حسابرس = استانداردهای حسابرسی."}, {"t": "مسئولیت مدیریت و حسابرس", "x": "- تهیه و ارائه صورت‌های مالی، کفایت افشا، و رعایت قوانین و مقررات ← مسئولیت **مدیریت**.\n\n- مسئولیت حسابرس: **اظهارنظر** درباره مطلوبیت صورت‌های مالی (در بند مقدمه گزارش حسابرسی صریحاً آمده است).\n\n- اظهارنظر حسابرس فقط **اعتبار** صورت‌های مالی را افزایش می‌دهد؛ تضمین ادامه فعالیت یا تأیید کارایی مدیریت نیست.\n\n- مسئولیت حقوقی حسابرس به بیان اظهارنظر محدود نمی‌شود (مثلاً مسئولیت در برابر اشخاص ثالث زیان‌دیده)."}, {"t": "ادعاهای مدیریت (پنج‌گانه)", "x": "- **۱) وجود یا رخداد:** دارایی‌ها و بدهی‌ها واقعاً وجود دارند و معاملات سود و زیان رخ داده‌اند.\n\n- **۲) کامل بودن:** همه رویدادها و معاملات ثبت و گزارش شده‌اند؛ هیچ رویداد گزارش‌نشده‌ای نیست.\n\n- **۳) حقوق و تعهدات:** دارایی‌ها متعلق به واحد است و بدهی‌ها تعهد آن است.\n\n- **۴) ارزشیابی و تخصیص:** اقلام طبق استانداردها ارزشیابی و به حساب‌های مربوط تخصیص یافته‌اند.\n\n- **۵) ارائه و افشا:** اقلام درست طبقه‌بندی و به اندازه کافی در متن یا یادداشت‌ها افشا شده‌اند."}, {"t": "نقش اعتباردهی حسابرسی", "x": "- دلیل اصلی وجود حرفه حسابرسی مستقل = **اعتباردهی** (ایجاد اطمینان از مطلوبیت ارائه و قابلیت اتکای صورت‌های مالی).\n\n- اعتباردهی دو مرحله دارد: **۱) رسیدگی** (گردآوری شواهد) و **۲) انتشار گزارش حسابرسی**) اعلام نظر حرفه‌ای).\n\n- اعتباردهنده باید هم **صلاحیت فنی** داشته باشد و هم **مستقل** باشد؛ استقلال واقعی و ظاهری هر دو مهم‌اند."}, {"t": "اهداف حسابرسی و تحول تاریخی", "x": "- الف) کسب **اطمینان معقول** از نبود تحریف بااهمیت (ناشی از تقلب یا اشتباه) در صورت‌های مالی به‌عنوان یک مجموعه، تا حسابرس بتواند اظهارنظر کند که صورت‌های مالی از تمام جنبه‌های بااهمیت طبق چارچوب گزارشگری (استانداردهای حسابداری) تهیه شده است یا خیر.\n\n- ب) **گزارشگری** و اطلاع‌رسانی طبق استانداردهای حسابرسی (استاندارد ۲۰۰، بند ۲).\n\n- پیش از قرن بیستم هدف: **کشف تقلب**. نیمه اول قرن بیستم: **اظهارنظر** نسبت به صورت‌های مالی + **نمونه‌گیری** (از اثبات تمام معاملات به آزمون معاملات منتخب)."}, {"t": "اطمینان معقول", "x": "- سطح بالای اطمینان، **نه مطلق**. با کاهش خطر حسابرسی به سطح پایین قابل قبول از طریق شواهد کافی و مناسب حاصل می‌شود.\n\n- دلیل مطلق نبودن: محدودیت‌های ذاتی حسابرسی؛ شواهد غالباً **متقاعدکننده** هستند نه قطعی. (مثال: **تبانی کارکنان**)."}, {"t": "شواهد حسابرسی", "x": "- **کافی بودن:** معیار **کمیت**؛ تابع ارزیابی خطر تحریف بااهمیت و کیفیت شواهد.\n\n- **مناسب بودن:** معیار **کیفیت**؛ شامل **مربوط بودن** و **قابلیت اتکا**."}, {"t": "عوامل توجیه‌کننده تقاضا برای حسابرسی", "x": "- **۱) تضاد منافع** بالقوه بین مالکان و مدیران\n\n- **۲) توسعه دامنه مبادلات اقتصادی** (پیامدهای اقتصادی بااهمیت)\n\n- **۳) پیچیدگی** صورت‌های مالی\n\n- **۴) عدم دسترسی مستقیم** استفاده‌کنندگان به اطلاعات (دور از دسترس بودن)\n\n- **۵) الزامات قانونی** یا اصرار ذی‌نفعی مانند بانک‌ها\n\nدر بیانیه مفاهیم بنیادی حسابرسی چهار عامل اول مطرح است و «عدم دسترسی مستقیم» مهم‌ترین عامل شمرده شده است. «مسئولیت قانونی حسابرسان» جزو عوامل تقاضا نیست."}, {"t": "انواع حسابرسان", "x": "- **حسابرس مستقل:** مستقل از واحد؛ به دعوت ذی‌نفعان یا حکم قانون؛ وظیفه: اعتباردهی و اظهارنظر؛ گزارش به دعوت‌کننده یا هر مرجعی که او تعیین کند.\n\n- **حسابرس داخلی:** کارمند واحد؛ هدف: ارزیابی اثربخشی کنترل‌های داخلی و کمک به مدیریت؛ زیر نظر کمیته حسابرسی یا مدیرعامل؛ بیشتر حسابرسی عملیاتی؛ گزارش به مدیریت.\n\n- **حسابرس دیوان محاسبات:** حسابرسی رعایت و عملیاتی در سازمان‌های دولتی و شرکت‌های طرف قرارداد دولتی؛ رسیدگی به درآمدها، هزینه‌ها، دریافت‌ها و پرداخت‌ها و صورت‌های مالی بنگاه‌های دولتی.\n\n- **ممیز مالیاتی:** حسابرسی **رعایت** اظهارنامه‌های مالیاتی.\n\n- **بازرس قانونی:** انتخاب برای شرکت سهامی عام **الزامی** است؛ توسط مجمع عمومی صاحبان سهام انتخاب می‌شود."}, {"t": "وظایف بازرس قانونی (قانون تجارت)", "x": "- الف) تأیید صحت و سقم صورت‌های مالی ارائه‌شده به مجمع از طرف هیئت مدیره\n\n- ب) اظهارنظر درباره گزارش فعالیت‌های هیئت مدیره\n\n- ج) حصول اطمینان از رعایت یکسان حقوق صاحبان سهام\n\n- د) دعوت مجمع عمومی در شرایط خاص\n\n- ه) گزارش وقوع جرم به محاکم قضایی و اولین مجمع عمومی\n\n- و) آگاه‌کردن مجمع در صورت ارائه اطلاعات خلاف حقیقت از سوی مدیران\n\nماده ۱۴۸ قانون تجارت: بازرسان درباره صحت صورت دارایی، حساب سود و زیان و ترازنامه و نیز صحت مطالب و اطلاعات مدیران اظهارنظر می‌کنند."}, {"t": "انواع حسابرسی از نظر اهداف و موضوعات مورد رسیدگی", "x": "الف) حسابرسی صورت‌های مالی ب) حسابرسی رعایت (بازرسی) ج) حسابرسی عملیاتی د) حسابرسی مدیریت (عملکرد)\n\n**الف) حسابرسی صورت‌های مالی: **در حسابرسی صورت‌های مالی، هدف تعیین مطابقت نحوه تهیه صورت‌های مالی (شامل ترازنامه، صورت سود و زیان، صورت سود و زیان جامع و صورت جریان وجوه نقد) با استانداردهای حسابداری یا اصول حسابداری است و استفاده‌کنندگان از آن، مدیریت، سرمایه‌گذاران، بانک‌ها، اعتباردهندگان، تحلیل‌گران مالی و سازمان‌های دولتی می‌باشند.\n\n**ب) حسابرسی رعایت: **عبارت است از فرآیند سیستماتیک جمع‌آوری شواهد به منظور تعیین تطابق موضوع مورد رسیدگی با قانون، دستورالعمل و مقررات و گزارش نتایج به افراد ذی‌نفع. حسابرسی رعایت جزء لاینفک حسابرسی صورت‌های مالی است.\n\nنتایج حاصل از حسابرسی رعایت به طرف وسیعی از استفاده‌کنندگان خارجی گزارش نمی‌شود. مدیران، نخستین گروهی هستند که به رعایت موارد فوق و رعایت بودجه و مقررات موضوعه به اجرا درآید.\n\nج) حسابرسی عملیاتی: به بررسی قسمتی‌های خاصی از سازمان به منظور سنجش نحوه عمل آن‌ها می‌پردازد یا به عبارت دیگر، به بررسی میزان انطباق سیاست‌ها و برنامه‌های سازمانی با عملکرد بخش‌های مختلف شرکت می‌پردازد. هدف در اینجا، بررسی میزان **کارایی** (میزان موفقیت در بهترین استفاده از منابع موجود)، **اثربخشی** (میزان موفقیت در رسیدن به هدف‌های تعیین شده) و **صرفه اقتصادی** (عبارت است از تلاش در جهت حداقل کردن هزینه تحصیل و استفاده از منابع سازمان با حفظ کیفیت مناسب) فعالیت‌ها است.\n\nد) حسابرسی مدیریت (عملکرد): در حسابرسی عملکرد، کارایی مدیریت از لحاظ چگونگی استفاده از منابع و نحوه اجرای برنامه‌ها و عملیات رسیدگی می‌شود و هدف از آن تعیین میزان کارایی و اثربخشی مدیران واحد تجاری است."}, {"t": "الف) استانداردهای عمومی", "x": "### استاندارد های حسابرسی\n\n۱. رسیدگی باید توسط فرد یا افرادی اجرا شود که دارای **صلاحیت و آموزش فنی** کافی به عنوان حسابرس باشند.\n\n۲. حسابرس یا حسابرسان باید **استقلال رای** خود را در تمام موارد مربوط به حسابرسی حفظ کنند.\n\n۳. در اجرای رسیدگی و تهیه گزارش باید **مراقبت حرفه‌ای لازم** به عمل آید."}, {"t": "ب) استانداردهای اجرای عملیات", "x": "۱. عملیات حسابرسی باید به **میزان کافی برنامه‌ریزی شود** و در صورت وجود کارکنان، بر کار آنان به گونه‌ای مناسب نظارت شود.\n\n۲. برای برنامه‌ریزی حسابرسی و تعیین نوع، زمان‌بندی و میزان آزمون‌هایی که باید اجرا شود، **شناختی کافی از ساختار کنترل داخلی باید کسب گردد**.\n\n۳. **شواهد کافی و قابل اطمینان** باید از راه بازرسی، مشاهده، پرس‌وجو و دریافت تاییدیه کسب شود تا مبنایی معقول برای اظهارنظر نسبت به صورت‌های مالی در مورد رسیدگی به دست آید."}, {"t": "ج) استانداردهای گزارشگری", "x": "۱. گزارش باید تصریح کند که صورت‌های مالی، طبق اصول پذیرفته شده **حسابداری تهیه شده است یا خیر**.\n\n۲. گزارش باید شرایط را مشخص سازد که در آن چنین اصولی در دوره جاری نسبت به دوره قبل، **به طور یکنواخت رعایت نشده است**.\n\n۳. **اطلاعات افشا شده** در صورت‌های مالی منطقاً کافی تلقی می‌شود **مگر آن که خلاف آن در گزارش بیان شو**د.\n\n۴. گزارش باید یا حاوی یک **اظهارنظر** درباره صورت‌های مالی به طور کلی، یا بیانگر این موضوع باشد که نظری نمی‌تواند اظهار شود. هنگامی که نظر کلی نتواند اظهار شود، دلایل آن باید بیان گردد. در تمام مواردی که نام حسابرس به نحوی با صورت‌های مالی ارتباط پیدا می‌کند، گزارش باید به طور صریح بیانگر **ویژگی** هر گونه **رسیدگی حسابرس**، و **میزان مسئولیتی** باشد که او به عهده می‌گیرد.\n\n4 نوع اظهار نظر حسابرسی:\n\n- مقبول: طبق اصول حسابداری تهیه شده\n\n- مشروط: ایراد با اهمیت دارد ولی فراگیر نیست.\n\n- مردود: ایراد با اهمیت دارد و فراگیر است.\n\n- عدم اظهار نظر: به خاطر محرومیت یا ابهام اساسی برای حسابرس."}]}, {"h": "فصل ۲) آیین رفتار حرفه‌ای", "a": [{"t": "مقدمه", "x": "تمام حرفه های شناخته شده برای حفظ شخصیت حرفه ای و بهبود کیفیت ضوابط خود آیین رفتار دارند. ویژگی های مشترک حرفه ها: الف) مسئولیت خدمت به جامعه ب) مجموعه پیچیده دانش پ) استانداردهای ورود ت) نیاز به اعتماد جامعه. حسابرس مستقل نماینده جامعه است و عبارت «تنها صاحبکار ماست» بیانگر جایگاه بلندمدت حرفه است. استقلال مهمترین مفهوم آیین رفتار است."}, {"t": "آیین چیست؟", "x": "آیین مجموعه‌ای از قواعد و مقرراتی است که رفتار افراد را در یک حوزه مشخص تنظیم می‌کند."}, {"t": "تفاوت اصول و احکام چیست؟", "x": "اصول مبانی و ارزش‌های بنیادی هستند که جهت کلی رفتار حرفه‌ای را مشخص می‌کنند؛ اما احکام قواعد مشخص‌تری هستند که تعیین می‌کنند در موقعیت‌های عملی چه کاری باید انجام داد یا از چه کاری باید خودداری کرد."}, {"t": "اصول آیین رفتار", "x": "- مسئولیت ها: اعمال قضاوت اخلاقی ، حرفه ای و دقیق در تمام فعالیت ها و همکاری برای خودنظمی و بهبود فن حسابداری .\n\n- منافع جامعه: عمل در جهت منافع جامعه و حفظ اعتماد عمومی؛ منافع جامعه بر منافع فردی صاحبکار یا کارفرما مقدم است .\n\n- درستکاری: ایفای تمام مسئولیت های حرف های با نهایت درستکاری حتی به زیان منافع شخصی.\n\n- بیطرفی و استقلال: بیطرفی در تمام مسئولیت ها؛ استقلال واقعی و ظاهری در خدمات حسابرسی و اعتباردهی.\n\n- دقت حرفه ای: رعایت استاندارد های فنی و رفتاری، تلاش مستمر برای بهبود کیفیت و ایفای مسئولیت در بالاترین حد توانایی .\n\n- دامنه و نوع خدمات: رعایت اصول هنگام تعیین خدمات قابل ارائه؛ وجود کنترل کیفیت و پرهیز از تضاد منافع."}]}, {"h": "فصل ۳) مسئولیت قانونی حسابرسان", "a": [{"t": "سهل‌انگاری", "x": "سهل‌انگاری عبارت است از انجام ندادن وظایف بر طبق استانداردهای حرفه‌ای. عملاً، سهل‌انگاری را می‌توان «اعمال نکردن مراقبت‌های حرفه‌ای» تفسیر کرد."}, {"t": "قصور", "x": "عبارت است از نبود کمترین دقت. بی‌توجهی عمده یک حسابرس نسبت به استانداردهای پذیرفته شده حسابرسی می‌تواند به عنوان قصور تفسیر شود."}, {"t": "تقلب", "x": "عبارت است از تحریف حقایق با اهمیت توسط کسانی که می‌داند مطلبش حقیقت ندارد یا ارائه حقایقی با کمال بی‌توجهی نسبت به صحت یا سقم آن با قصد فریب‌دادن دیگران (تحریف با نیت) و یا این نتیجه که طرف مقابل، زیان ببیند."}, {"t": "معادل تقلب", "x": "از این نظر با تقلب به شرح بالا متفاوت است که معادل تقلب، یک تحریف با قصد فریب دادن نیست (تحریف بدون نیت). قصور حسابرسان می‌تواند در دادگاه به عنوان معادل تقلب محسوب شود."}, {"t": "رابطه حقوقی", "x": "عبارت است از رابطه بین طرفین یک قرارداد. حسابرس مستقل با صاحبکاری که برایش کار می‌کند رابطه حقوقی دارد، همانگونه که با هر شخص ثالث ذینفع دیگری در ارتباط است. از نمونه های اشخاص ثالث می توان اشاره کرد به: دولت، سرمایه گذار بالقوه، قوه قضاییه و طیف وسیعی از ذی نفعان."}, {"t": "شخص ثالث ذینفع", "x": "کسی است که نه متعهد است و نه متعدله و به عنوان دارنده حقوق مشخص در قرارداد از او نام برده شده یا منظور طرفین قرارداد بوده باشد.\n\nاقدامات مثبتی که به حسابرسان در مقابله با تهدیدات حقوقی یاری می رساند شامل موارد زیر است:\n\n۱. **تأکید بیشتر بر رعایت استانداردهای پذیرفته شده حسابرسی و آیین رفتار حرفه‌ای**.\n\n۲**. استفاده از مشاوران حقوقی که به مسئولیتهای قانونی حسابرسان آشنا باشند**. حسابرسان باید تمام موارد بالقوه خطرناک را بطور کامل با مشاوران حقوقی خود در میان گذارند و نظرات آنان را به دقت مورد توجه قرار دهند.\n\n۳. **داشتن پوشش بیمه‌ای کافی برای تعهدات و مسئولیتها**. داشتن پوشش بیمه‌ای کافی برای تعهدات و مسئولیتها، یک ضرورت است.\n\n۴. **شناسایی کامل صاحبکاران جدید**. همانگونه که در دعاوی یادشده در این فصل آمد، دعاوی زیادی به مشارکت حسابرسان در اتهامات جزایی مدیریت ارشد شرکتهای صاحبکار حسابرسان مربوط بوده است. حسابرسان باید در شناسایی صاحبکاران جدید دقت کنند تا مانع از خطرات برقراری ارتباط حرفه با خطاپیشگان شود.\n\n۵. **بدست آوردن آگاهی و شناخت کامل از کار صاحبکار**. یکی از دلایل عمده ناکامیهای حسابرسی، نداشتن شناخت و آگاهی از کار صاحبکار و رویه‌های متداول در صنعت آن بوده است.\n\n۶. **بهره‌گیری از موافقتنامه حسابرسی در کلیه موارد ارائه خدمات حرفه‌ای**. با یک قرارداد کتبی که خدمات مورد قرارداد را به روشنی مشخص کند می‌توان اختلاف‌نظرهای احتمالی و مربوط به نوع خدمات حسابرسان را به حداقل رساند. موافقتنامه حسابرسی در فصل ۴ مورد بحث قرار می‌گیرد.\n\n۷. **ارزیابی دقیق احتمال وجود اشتباهات و تخلفات در صورتهای مالی صاحبکار در مراحل برنامه‌ریزی کار**. هنگامی که سیستم کنترل داخلی صاحبکار دارای ضعف با اهمیت است، دقت ویژه‌ای به عمل آورید.\n\n۸**. اعمال نهایت دقت در حسابرسی صاحبکارانی که دچار تنگناهای مالی می‌باشند**. در شرکتهایی که توان ایفای تعهدات خود را ندارند یا ورشکسته می‌باشند، اعتباردهندگان و صاحبان سهام احتمالاً دنبال شخصی می‌گردند تا تقصیر زیانهای خود را به گردن وی اندازند. همانگونه که در مثالهای این فصل دیدید، دعاوی اقامه شده علیه حسابرسان بیشتر درباره صاحبکارانی بود که بعداً ورشکست شده‌اند."}]}, {"h": "فصل ۴) حرفه حسابرسی مستقل", "a": [{"t": "مقدمه", "x": "بیشتر مؤسسات حسابرسی به شکل تضامنی اداره می‌شوند، هرچند که یک حسابرس مستقل می‌تواند در مؤسسه انفرادی خود یا در یک شرکت حرفه‌ای به کار حسابرسی بپردازد. شکل تضامنی در مقایسه با مؤسسه انفرادی دارای مزایای فراوانی است.۱ هنگامی که دو یا چند حسابرس با یکدیگر همکاری می‌کنند، امکان این که هر یک در کاری تخصص یابند افزایش می‌یابد و نوع و میزان خدمات ارائه شده به صاحبکاران، مانند برنامه‌ریزی مالیاتی و خدمات مشاوره مدیریت، نیز ممکن است گسترش یابد. همچنین، برای حسابرسان واجد شرایطی که در استخدام مؤسسه می‌باشند این امکان به وجود می‌آید که به سمت شریک مؤسسه ارتقا یابند. به وجود آوردن فرصت مشارکت برای کارکنان، یکی از عوامل مهم جلب همکاری و حفظ افراد با لیاقت توسط مؤسسات حسابرسی است. شکل تضامنی مؤسسه حسابرسی، از راه تبادل‌نظر و بحثهای شرکا درباره مشکلات حسابرسی و مسایل روز نیز فرصتهایی را برای رشد حرفه به وجود می‌آورد."}, {"t": "مسئولیتهای کارکنان حرفه‌ای", "x": "خصوصیات انسانی چون لیاقت، قضاوت و قدرت تصمیم‌گیری، و درستکاری کارکنان، بزرگترین سرمایه یک مؤسسه حسابرسی است. کارکنان حرفه‌ای یک مؤسسه حسابرسی بطور معمول عبارتند از شرکا، مدیران، سرپرستان و کمک‌حسابرسان."}, {"t": "شرکا چه کسانی هستند و چه وظایفی دارند؟", "x": "### شرکا\n\nمسئولیت اصلی شرکا، در تماس بودن با صاحبکاران است. گفتگو با صاحبکاران در مورد هدفها و دامنه رسیدگی، حل و فصل اختلاف‌نظرهایی که ممکن است درباره نحوه انعکاس اقلام در صورتهای مالی پیش آید و شرکت در مجامع عمومی صاحبکار به منظور پاسخگویی در مورد سؤالات مربوط به صورتهای مالی یا گزارش حسابرسی از جمله تماس‌های یک شریک با صاحبکار است. سایر مسئولیت‌های یک شریک عبارت است از استخدام کارمندان جدید، سرپرستی و نظارت کلی بر کارکنان حرفه‌ای، بررسی نهایی کاربرگ‌ها و امضای گزارش‌های حسابرسی.\n\nسطح سازمانی شرکای یک مؤسسه حسابرسی با بالاترین رده مدیریت در یک سازمان صنعتی قابل مقایسه است. مدیران در این سطح معمولاً به فکر پیشرفت بلندمدت سازمان و بهبود جامعه‌ای هستند که شرکت در آن فعالیت می‌کند. آنان باید مقدار زیادی از وقت خود را صرف فعالیت‌های اجتماعی، حرفه‌ای و آموزشی جامعه کنند و معمولاً این کار را نیز می‌کنند. یکی از دلایل حضور فعال شرکا در سازمان‌های مختلف اجتماعی و تجاری، **اعتبار **و **شناختی** است که از مؤسسه حسابرسی آنان به وجود می‌آید. بیشتر صاحبکاران، مؤسسه‌ای را انتخاب می‌کنند که یکی از شرکای آن را می‌شناسند و به وی احترام می‌گذارند. در نتیجه، شریکی که در جامعه به خوبی شناخته شده و مورد احترام باشد می‌تواند عامل عمده‌ای در جلب کار برای مؤسسه حسابرسی باشد."}, {"t": "مدیران در موسسات حسابرسی چه وظایفی دارند؟", "x": "مدیران در مؤسسات حسابرسی بزرگ، بیشتر وظایفی را که شرکای مؤسسات حسابرسی کوچک انجام می‌دهند به عهده مدیران یا سرپرستان است. یک مدیر ممکن است همزمان، مسئولیت نظارت بر دو یا چند کار حسابرسی را داشته باشد. بررسی کاربرگ‌ها و تبادل نظر با اعضای تیم رسیدگی و صاحبکار درباره مسائل حسابداری که ممکن است حین رسیدگی پیش آید از جمله موارد نظارت مدیر است. مسئولیت تعیین روش‌های رسیدگی برای هر حسابرسی و اعمال استانداردهای اجرای عملیات به عهده مدیر است. مدیران، اغلب مسئول گردآوری اطلاعات لازم برای ارسال صورت‌حساب برای صاحبکاران و وصول آن می‌باشند.\n\nآشنایی با قوانین مالیاتی و تجاری و مقررات بورس اوراق بهادار و همچنین، آگاهی به مسایل روز مربوط به حرفه و نظریه‌های حسابداری، لازمه موفقیت یک مدیر است. مدیران حسابرسی نیز ممکن است مانند شرکای مؤسسه در یک صنعت خاص یا زمینه دیگری از کار مؤسسه تخصص یابند."}, {"t": "سرپرست کیست و چه کارهایی انجام می دهد؟", "x": "### سرپرستان\n\nسرپرست تیم رسیدگی کسی است که صلاحیت برنامه‌ریزی و اجرای یک رسیدگی را دارد و گزارش حسابرسی آن را برای تایید مدیر و شریک، تنظیم می‌کند. سرپرست در اجرای هر حسابرسی، بیشتر کارهای حسابرسی را با توجه به ارزیابی خود از توان هر یک از کمک حسابرسان نسبت به اجرای بخشی خاص از کار، بین آنان تقسیم می‌کند. یک فارغ‌التحصیل خوب دانشگاهی در رشته حسابداری می‌تواند ظرف دو تا سه سال، یا حتی کمتر، از کمک حسابرسی به سرپرستی ارتقا یابد.\n\n**دادن آموزش ضمن کار به کارکنان**، یکی از مسئولیت‌های عمده سرپرستان است. سرپرست هنگام واگذاری کار به کمک حسابرسان باید هدف نهایی از آن بخش از رسیدگی را به روشنی برای آنان توضیح دهد.\n\n**بررسی کاربرگ‌ها به محض تکمیل شدن**، یکی دیگر از وظایف سرپرست تیم رسیدگی است. این بررسی سبب می‌شود سرپرست بتواند کار را کنترل و کفایت رسیدگی در هر مرحله را تعیین کند. سرپرست در پایان عملیات حسابرسی، یک بررسی نهایی انجام می‌دهد. در این بررسی، کلیه اقلام تک‌تک کاربرگ‌ها به صورتهای مالی ردیابی می‌شود.\n\nسرپرست، همچنین، پیوسته حساب ساعات کارکرد تمام کارکنان را برای هر مرحله از رسیدگی نگهداری می‌کند."}, {"t": "کمک حسابرسان کیستند و چه کارهایی انجام می دهند؟", "x": "### کمک حسابرسان\n\nاولین سمت یک فارغ‌التحصیل دانشگاهی در بدو ورود به حرفه حسابرسی، کمک حسابرس است. کمک حسابرس معمولاً به وظایف گوناگونی گمارده می‌شوند تا از توان تجزیه و تحلیل و پیشرفت آنان به نحوی کامل استفاده شود.\n\nعملیات حسابرسی باید **به میزان کافی برنامه‌ریزی شود** و در صورت وجود کارکنان، بر کار آنان **به گونه‌ای مناسب نظارت شود**.\n\nعلاوه بر این، استاندارد حسابرسی برنامه‌ریزی و سرپرستی نیز راهنماییهای لازم جهت برنامه‌ریزی کافی در هر کار حسابرسی را برای حسابرسان ارائه کرده است.\n\nبرنامه‌ریزی کافی به معنای این است که در مورد صاحبکار جدید قبل از قبول کار تحقیق شود، درباره فعالیت آن شناخت لازم کسب گردد و برای سازماندهی، یکنواخت‌سازی و تنظیم برنامه کار حسابرسان طرحی کلی تنظیم شود.\n\nمؤسسات حسابرسی باید قبل از پذیرش یک کار، در مورد صاحبکار آن تحقیق کنند. حسابرسان باید درباره سوابق صاحبکار آتی، شامل: مشخصات و حسن شهرت مدیران، مسئولین و سهامداران عمده شرکت صاحبکار، تحقیق کنند. زمانی که وضعیت مالی شرکت ضعیف است یا شرکت نیاز مبرم به سرمایه دارد، انگیزه مدیران شرکت برای بیش از واقع نشان دادن نتایج عملیات، افزایش می‌یابد."}, {"t": "وظایف کمیته های حسابرسی", "x": "### کمیته‌های حسابرسی\n\n- انتخاب حسابدار (مهم ترین وظیفه)\n\n- کنترل «کنترل های داخلی»\n\n- مخاطب نامه های حسابرسی حسابرسان (گزارش ضعف کنترل های داخلی)\n\n- میانجگری میان کارفرما و تیم حسابرسی\n\nبسیاری از شرکتها اقدام به تشکیل کمیته حسابرسی از بین هیأت مدیره کرده‌اند تا نقش ناظر بر رویه‌ها و نحوه عملهای حسابداری و گزارشگری مالی واحد تجاری را به عهده گیرد. کمیته حسابرسی هم با حسابرسان داخلی در تماس است و هم با حسابرسان مستقل شرکت.\n\nیک کمیته حسابرسی معمولاً از سه تا پنج نفر مدیر غیر موظف - یعنی، مدیری که نه از مسئولین شرکت است و نه از کارکنان آن - تشکیل می‌شود. نبودن مدیران موظف در کمیته حسابرسی سبب می‌شود تا حسابرسان بتوانند مسایلی چون نقاط ضعف کنترلهای داخلی، اختلاف‌نظر با مدیریت درباره اصول و روشهای حسابداری، نشانه‌های احتمالی از سوءاستفاده‌های مدیریت یا سایر اعمال غیرقانونی مسئولین شرکت را با کمیته حسابرسی، صریح‌تر مطرح کنند. تماسهای کمیته حسابرسی با حسابرسان، اطلاعات به موقعی درباره وضعیت مالی شرکت و نیز اطلاعات لازم برای ارزیابی کارآیی و درستکاری مدیریت را در اختیار هیأت مدیره شرکت قرار می‌دهد.\n\nتمام صاحبکاران حسابرسی دارای کمیته حسابرسی نیستند.\n\n**توجه به احتمال وجود تحریف در مانده حسابها** احتمال خطر حسابرسی در سطح مانده هر حساب می‌تواند به سه احتمال **خطر ذاتی**، **کنترل** و **عدم کشف** تجزیه شود. احتمال خطر ذاتی عبارت است از (احتمال رخ دادن یک تحریف با اهمیت در یک حساب و با فرض اینکه برای آن، کنترل داخلی وجود نداشته باشد) **احتمال خطر** کنترل عبارت است از (احتمال این که سیستم کنترل داخلی صاحبکار نتواند به موقع از رخ دادن یک تحریف با اهمیت پیشگیری یا آن را کشف کند) **احتمال خطر عدم کشف** عبارت است از (احتمال این که روشهای رسیدگی حسابرسان سبب شود به این نتیجه برسند که تحریف با اهمیتی در حساب **وجود ندارد**، در حالی که حساب مزبور واقعاً حاوی تحریف با اهمیت است.)"}, {"t": "آزمون محتوا: اثبات اقلام مندرج در صورت های مالی", "x": "مستند سازی مراحل برنامه ریزی در کاربرگ ها با تهیه طرح های حسابرسی، برنامه های حسابرسی و بودجه‌های زمانی انجام می‌شود. این کاربرگهای «برنامه‌ریزی و سرپرستی» دو هدف را برآورده می‌کنند. یکی، شواهد لازم برای رعایت «برنامه‌ریزی کافی» موردنظر اولین استاندارد اجرای عملیات توسط مؤسسه حسابرسی را فراهم می‌آورد. دیگر این که کاربرگهای مزبور ابزار لازم برای هماهنگی، زمان‌بندی و سرپرستی حسابرسانی که به رسیدگیها می‌پردازند را برای سرپرست تیم رسیدگی فراهم می‌آورد."}, {"t": "طرح حسابرسی", "x": "عبارت است از دیدی کلی از کار حسابرسی که رئوس مطالب مربوط به نوع ویژگیهای عملیات صاحبکار و طرح کلی حسابرسی را مشخص می‌کند. یک طرح متداول شامل جزییات مربوط به موارد زیر است:\n\n۱. مشخصات شرکت صاحبکار شامل ساختار، فعالیت تجاری و سازمان آن.\n\n۲. هدفهای حسابرسی (برای مثال، حسابرسی برای مجمع عمومی، حسابرسی ویژه، حسابرسی مورد نظر بورس اوراق بهادار).\n\n۳. نوع و حدود سایر خدمات، مانند تنظیم اظهارنامه مالیاتی از طرف صاحبکار.\n\n۴. زمان‌بندی کار حسابرسی، شامل تعیین روشهایی که می‌تواند قبل از تاریخ ترازنامه اجرا شود، کارهایی که باید در تاریخ ترازنامه یا بعد از آن اجراشود و تعیین تاریخ اجرای روشهای خاصی چون شمارش موجودی صندوق، ارسال درخواست تأییدیه بدهکاران و نظارت بر شمارش موجودیها (انبارگردانی).\n\n۵. کارهایی که قرار است کارکنان صاحبکار انجام دهند.\n\n۶. تعیین نیروی انسانی در طول انجام کار.\n\n۷. تعیین تاریخ تکمیل بخشهای عمده کار، مانند ارزیابی کنترلهای داخلی، تنظیم اظهارنامه مالیاتی، گزارش حسابرسی و ارائه گزارش به بورس اوراق بهادار.\n\n۸. هرگونه مشکلات خاصی که در طول رسیدگیها باید حل شود، مانند مشکلاتی که در نتیجه اجرای روشهای تحلیلی آشکار می‌شود.\n\n۹. برآورد اولیه از سطوح اهمیت برای کار."}, {"t": "برنامه های حسابرسی", "x": "یک برنامه حسابرسی عبارت است از فهرست کارهای حسابرسی که باید انجام شود، به‌گونه‌ای که روشهای لازم برای اثبات هر یک از اقلام صورتهای مالی را مشخص و زمان لازم برای اجرای هر روش را تعیین کند. پس از تکمیل هر مرحله از برنامه حسابرسی، تاریخ، نام رسیدگی‌کننده و زمان واقعی صرف شده برای هر قلم می‌تواند در مقابل آن ثبت شود.\n\nوجود دستورالعملهای تفصیلی (با جزئیات) رسیدگی در برنامه این اطمینان را به وجود می‌آورد که هیچ یک از اقدامات اساسی و لازم برای اثبات اقلام، نادیده گرفته نخواهد شد.\n\nبرنامه‌های حسابرسی به مراتب مفصل‌تر از طرح حسابرسی است. طرح حسابرسی، رئوس هدفهای رسیدگی را مشخص می‌کند و برنامه حسابرسی، روشهایی را تعیین می‌کند که برای دستیابی به این هدفها باید اجرا شود.\n\nمؤسسات حسابرسی معمولاً حق‌الزحمه حسابرسی را براساس زمان کارکرد، صورت‌حساب می‌کنند و بنابراین، جزییات ساعات صرف شده برای هر کار حسابرسی باید ثبت و نگهداری شود. بودجه زمانی هر کار حسابرسی از برآورد کردن زمان لازم جهت هر مرحله از کار و برای هر یک از سطوح مختلف کارکنان حسابرسی و سپس، جمع زدن این مقادیر برآوردی بدست می‌آید. بودجه زمانی کار حسابرسی علاوه بر تأمین مبنایی برای محاسبه حق‌الزحمه، کاربردهای دیگری نیز دارد. بودجه زمانی، بخشهایی از کار را که به نظر مدیر یا شریک مؤسسه از حساسیت برخوردار است و به صرف زمان بیشتری نیاز دارد، به اطلاع اعضای تیم رسیدگی می‌رساند. بودجه زمانی، ابزار مهمی برای سرپرستان است، بدین معنا که از آن برای اندازه‌گیری کارآیی کارکنان حسابرسی و تشخیص این که کار حسابرسی در هر مرحله، از پیشرفت رضایت‌بخشی برخوردار است یا خیر، استفاده می‌شود.\n\nحسابرسان همواره برای تکمیل رسیدگیها در محدوده زمان برآوردی آن، در فشارند. یک کمک حسابرس که بیش از حد معمول وقت صرف انجام کاری می‌کند احتمالاً مورد علاقه سرپرستان قرار نمی‌گیرد یا نمی‌تواند به سرعت ترقی کند. توانایی انجام دادن کار رضایت‌بخش در یک فرصت نامحدود، امتیاز ویژه‌ای نیست چون در حرفه حسابرسی مستقل، زمان هرگز نامحدود نیست."}, {"t": "فرآیند حسابرسی", "x": "مراحل اساسی فرآیند حسابرسی در بیشتر موارد اصولاً یکسان به شرح زیر است:\n\n۱. شناختی از سیستم کنترل داخلی بدست آورید که برای برنامه‌ریزی، کافی باشد (شناخت).\n\n۲. احتمال خطر کنترل را برآورد و آزمونهای اضافه بر آنچه در مرحله ۱ بالا انجام شده است را برای کنترل‌ها طراحی کنید (برآورد اولیه خط کنترل).\n\n۳. آزمونهای اضافی کنترل‌ها را اجرا کنید (آزمون رعایت (کنترل)).\n\n۴. احتمال خطر کنترل را دوباره برآورد و آزمونهای محتوا را طراحی کنید (برآمورد نهایی از خط کنترل).\n\n۵. آزمونهای محتوا را اجرا کنید و رسیدگیها را تکمیل کنید (آزمون محتوا).\n\n۶. نوع اظهارنظر خود را مشخص و گزارش حسابرسی را صادر کنید (گزارش حسابرسی)."}]}, {"h": "فصل ۵) کنترل‌های داخلی", "a": [{"s": "درسنامه‌ای برای این فصل وجود ندارد."}]}, {"h": "فصل ۶) کنترل‌های داخلی در سیستم‌های کامپیوتری", "a": [{"s": "درسنامه‌ای برای این فصل وجود ندارد."}]}, {"h": "فصل
